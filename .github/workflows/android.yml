name: Build Android app

# Run by hand (Actions → Build Android app → Run workflow). Builds android/ and signs it with the key in the repo's
# secrets, then leaves the APK as a download on the run. The key itself is never in this repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.keystore"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/key.keystore" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias cof --out City-of-Fighters.apk aligned.apk
          rm "$RUNNER_TEMP/key.keystore"
      - name: Check the key matches the website
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --print-certs City-of-Fighters.apk | tee certs.txt
          APK=$(grep -i 'SHA-256' certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr a-f A-F)
          SITE=$(grep -oE '[0-9A-F]{2}(:[0-9A-F]{2}){31}' public/.well-known/assetlinks.json | tr -d ':')
          test "$APK" = "$SITE"
          "$TOOLS/aapt2" dump badging City-of-Fighters.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: City-of-Fighters-apk
          path: City-of-Fighters.apk
