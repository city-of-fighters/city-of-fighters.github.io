<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#0e0e10"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>City of Fighters Registration</title>
<script>
// The bare address on a computer opens the Control panel, like the PC app. Phones, tablets and links to index.html stay here.
if (location.pathname === '/' && matchMedia('(min-width: 900px) and (hover: hover) and (pointer: fine)').matches) location.replace('admin.html');
</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  .hero { text-align: center; }
  .hero img { width: 220px; max-width: 70%; filter: drop-shadow(0 0 16px #ff0a6c66); }
  .hero .ev { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .reg { text-align: center; padding: 24px 16px; }
  .reg .big { font: 700 24px var(--display); text-transform: uppercase; letter-spacing: 1px; }
  .reg .go { display: block; margin: 14px auto 0; max-width: 340px; padding: 13px 16px; font-size: 18px; background: linear-gradient(var(--pink), var(--pink2)); border: 0; color: #fff; box-shadow: 0 0 16px #ff0a6c55; }
  .next { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; flex-wrap: wrap; }
  .next b { font: 700 18px var(--display); text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body class="app">
<main style="max-width:560px">
  <div class="hero"><img src="logo-clear.png" alt="City of Fighters"><div class="ev" id="ev"></div><div class="dim" id="game"></div></div>
  <div class="card reg" id="reg"><p class="dim">Loading…</p></div>
  <p class="legal"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
</main>
<nav class="appnav"><a href="app.html"><b>🏆</b>Leaderboard</a><a href="events.html"><b>📅</b>Events</a><a class="on" href="index.html"><b>✍️</b>Register</a><a href="phone.html"><b>🔒</b>Admin</a></nav>
<script src="bracket.js"></script><script src="api.js"></script><script src="consent.js"></script><script src="account.js"></script>
<script>
// Players register only with their start.gg account; the control panel pulls them in from start.gg. Once "Log in with
// start.gg" is set up they log in here and join City of Fighters events from the calendar.
let cfg = null;
async function accountCard() {
  cfg ??= await acctConfig();
  if (!cfg) return false;
  const me = await acctMe();
  $('reg').innerHTML = me ? `<div class="big">You're logged in</div><p>as <b>${esc(me.name)}</b>. Pick an event and press Participate.</p>
      <a class="btnlink go" href="events.html">Open the calendar</a>`
    : `<div class="big">Register with start.gg</div><p>Log in once with your start.gg account and stay logged in. Then join any City of Fighters event from the calendar.</p>
      <button type="button" class="btnlink go" id="in">Log in with start.gg</button>`;
  return true;
}
document.addEventListener('click', e => { if (e.target.id === 'in') acctLogin(cfg); });
const $ = id => document.getElementById(id);
const HUB = 'https://www.start.gg/hub/city-of-fighters/schedule';
const fmtDate = iso => new Date(iso).toLocaleString([], { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
async function load() {
  let s, events;
  try { [s, events] = await Promise.all([rpc('cof_public').then(view), rpc('cof_events_list').catch(() => [])]); }
  catch (e) { return ($('reg').textContent = e.message); }
  $('ev').textContent = s.status === 'none' ? 'City of Fighters' : s.name;
  $('game').textContent = s.status === 'none' ? '' : `${s.game}${s.eventAt ? ' · 📅 ' + fmtDate(s.eventAt) : ''} · ${s.players.length} signed up`;
  if (await accountCard()) return;
  // no player login yet: plain links to start.gg
  // the current tournament, while it is linked to start.gg and hasn't started
  const t = s.startgg?.slug && s.status === 'setup' && !s.matches.length ? s.startgg.slug.split('/event/')[0] : null;
  if (t) return ($('reg').innerHTML = `<div class="big">Register on start.gg</div>
    <p>Sign up with your start.gg profile. You'll show up here within a few minutes.</p>
    <a class="btnlink go" href="https://www.start.gg/${esc(t)}/register" target="_blank" rel="noopener">Register for ${esc(s.name)}</a>`);
  // otherwise: the next events on start.gg
  const next = events.filter(e => /^https:\/\/(www\.)?start\.gg\//.test(e.link ?? '')).slice(0, 5);
  $('reg').innerHTML = `<div class="big">Register on start.gg</div>
    <p>${s.status === 'running' || s.status === 'finished' ? 'Registration for this tournament is closed. ' : ''}All City of Fighters tournaments take sign-ups on start.gg, with your start.gg profile.</p>
    ${next.map(e => `<div class="next"><span><b>${esc(e.name)}</b><br><span class="dim">${esc(fmtDate(e.at))}</span></span>
      <a class="btnlink" href="${esc(e.link)}" target="_blank" rel="noopener">Sign up</a></div>`).join('')}
    <a class="btnlink go" href="${HUB}" target="_blank" rel="noopener">All events on start.gg</a>`;
}
load();
setInterval(load, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
