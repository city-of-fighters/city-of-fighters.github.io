<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#0e0e10"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>City of Fighters</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bracket.css">
<style>
  main { max-width: 640px; }
  .hero { text-align: center; padding-top: 6px; }
  .hero img { width: 220px; max-width: 70%; filter: drop-shadow(0 0 16px #ff0a6c66); }
  .hero .ev { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .empty { text-align: center; padding: 28px 16px; }
  .empty .big { font-size: 22px; font-weight: 800; }
  .champ { text-align: center; font-size: 22px; font-weight: 800; color: #ffd24a; text-shadow: 0 0 14px #ffd24a88; }
  .lb td { padding: 9px 6px; }
  .lb td.pl { width: 48px; color: var(--violet); font-weight: 800; }
  .lb tr:first-child td.pl { color: #ffd24a; }
  .lb td.r { text-align: right; color: var(--dim); font-size: 14px; white-space: nowrap; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; font-weight: 800; font-size: 18px; }
  .vs .sc { font-size: 30px; color: var(--pink); }
  .event { text-align: center; color: var(--violet); font-weight: 700; margin-top: 4px; }
  .watch { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 0; padding: 13px 16px; font-size: 19px; letter-spacing: 2px;
           background: linear-gradient(var(--pink), var(--pink2)); border: 0; color: #fff; box-shadow: 0 0 16px #ff0a6c55; }
  .watch:hover { background: linear-gradient(#ff2a82, var(--pink)); }
  .choices { display: grid; gap: 8px; margin-top: 10px; }
  .choices button { width: 100%; padding: 13px 12px; font-size: 17px; clip-path: none; }
  #getApp ol { margin: 8px 0; padding-left: 24px; } #getApp li { margin: 8px 0; }
  .watch i { width: 11px; height: 11px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .watch i { animation: none; } }
  .past button.pt { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; text-transform: none; letter-spacing: 0; font: inherit; padding: 10px 12px; margin: 6px 0 0; clip-path: none; }
  .past button.pt b { font: 700 17px var(--display); text-transform: uppercase; letter-spacing: 1px; }
  .past button.pt .w { color: #ffd24a; white-space: nowrap; }
  .past .detail { padding: 6px 4px 10px; }
  .past .mr td { font-size: 14px; padding: 5px 6px; } .past .mr .won { color: #fff; font-weight: 700; }
</style>
</head>
<body class="app">
<main>
  <div class="hero"><img src="logo-clear.png" alt="City of Fighters"><div class="ev" id="ev"></div><div class="dim" id="sub"></div>
    <a class="btnlink watch" href="https://www.twitch.tv/city_of_fighters" target="_blank" rel="noopener"><i></i>Watch it live on Twitch</a></div>

  <div class="card" id="installCard" hidden>
    <h2>Get the app</h2>
    <div id="getApp"></div>
  </div>

  <div id="body"></div>
  <div class="card past" id="past" hidden><h2>🏛️ Past tournaments</h2><div id="pastList"></div></div>
  <p class="legal"><span id="getAppLink"><a href="#">📲 Get the app</a> · </span><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
</main>
<nav class="appnav"><a class="on" href="app.html"><b>🏆</b>Leaderboard</a><a href="events.html"><b>📅</b>Events</a><a href="index.html"><b>✍️</b>Register</a><a href="phone.html"><b>🔒</b>Admin</a></nav>
<script src="bracket.js"></script><script src="api.js"></script><script src="consent.js"></script><script src="bracketview.js"></script>
<script>
const $ = id => document.getElementById(id);
const ord = n => n + ((n % 100 > 10 && n % 100 < 14) ? 'th' : { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
const fmtDate = iso => new Date(iso).toLocaleString([], { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
let lastKey = '';

// Public, read-only: anyone can look, only the admin can change anything.
async function draw() {
  const s = view(await rpc('cof_public'));
  const key = JSON.stringify([s.raw, s.players.length, s.regState]);
  if (key === lastKey) return; // only redraw on changes, so scrolling and the open bracket stay put
  lastKey = key;
  $('ev').textContent = s.status === 'none' ? 'City of Fighters' : s.name;
  $('sub').textContent = s.status === 'none' ? '' : `${s.game} · ${B.FORMATS[s.format] ?? ''}`;
  if (s.status === 'none' || s.status === 'setup') {
    // sign-up happens on start.gg (Register tab)
    const reg = s.status === 'none' ? '' : `<p>${s.players.length} signed up</p><a class="btnlink" href="index.html">Register on start.gg</a>`;
    const when = s.status === 'setup' && s.eventAt ? `<p class="event">📅 ${esc(s.name)}: ${esc(fmtDate(s.eventAt))}</p>` : '';
    $('body').innerHTML = `<div class="card empty"><div class="big">No tournament in progress.</div>${when}${reg}</div>`;
    return;
  }
  const pts = s.format === 'robin' || s.format === 'swiss';
  const m = s.matches.find(x => x.id === s.streamMatch && !x.winner);
  const champ = s.finished ? s.standings.filter(r => r.place === 1).map(r => r.name).join(' & ') : '';
  $('body').innerHTML = (champ ? `<div class="card champ">🏆 ${esc(champ)} is the champion!</div>` : '')
    + (m ? `<div class="card"><h2>🔴 Now on stream · ${esc(m.label)}</h2><div class="vs"><div>${esc(m.aName)}</div>
        <div class="sc">${m.ga} – ${m.gb}</div><div>${esc(m.bName)}</div></div></div>` : '')
    + `<div class="seg" role="tablist">${[['standings', '📊 Standings'], ['bracket', pts ? '🗓️ Matches' : '🏆 Bracket']].map(([k, t]) =>
        `<button type="button" role="tab" data-view="${k}" class="${tab === k ? 'on' : ''}" aria-selected="${tab === k}">${t}</button>`).join('')}</div>`
    + (tab === 'standings'
      ? `<div class="card"><table class="lb">${s.standings.map(r => `<tr><td class="pl">${r.place ? ord(r.place) : '–'}</td>
          <td><b>${esc(r.name)}</b></td><td class="r">${pts ? `${r.pts} pts` : `${r.w}–${r.l}`} · games ${r.gw}–${r.gl}</td></tr>`).join('')}</table>
          ${pts ? '' : '<p class="dim" style="font-size:13px;margin-bottom:0">Placings fill in as players are knocked out.</p>'}</div>`
      : `<div class="card">${mobileBracketHTML(s, round)}</div>`);
}
// Standings / Bracket switch and the bracket's round buttons
let tab = 'standings', round = null;
$('body').addEventListener('click', e => {
  const v = e.target.closest('[data-view]')?.dataset.view, r = e.target.closest('[data-round]')?.dataset.round;
  if (v) tab = v; else if (r) round = r; else return;
  lastKey = ''; draw();
});
live(draw);

// Past tournaments: the list loads once a minute; tapping one opens its final standings and results.
let pastOpen = null, pastData = {};
async function drawPast() {
  const list = await rpc('cof_archive_list').catch(() => []);
  $('past').hidden = !list.length;
  $('pastList').innerHTML = list.map(t => `<button type="button" class="pt" data-past="${esc(t.key)}" aria-expanded="${pastOpen === t.key}">
      <span><b>${esc(t.name)}</b><br><span class="dim">${esc(t.game)} · ${t.players} players${t.eventAt || t.at ? ' · ' + esc(new Date(t.eventAt || t.at).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' })) : ''}</span></span>
      <span class="w">🏆 ${esc((t.champions || []).join(' & '))}</span></button>${pastOpen === t.key ? `<div class="detail">${pastDetail(pastData[t.key])}</div>` : ''}`).join('');
}
function pastDetail(d) {
  if (!d) return '<p class="dim">Loading…</p>';
  const pts = d.format === 'robin' || d.format === 'swiss';
  return `<table class="lb">${d.standings.map(r => `<tr><td class="pl">${r.place ? ord(r.place) : '–'}</td><td><b>${esc(r.name)}</b>${r.team ? ` <span class="dim">${esc(r.team)}</span>` : ''}</td>
      <td class="r">${pts ? `${r.pts} pts` : `${r.w}–${r.l}`} · games ${r.gw}–${r.gl}</td></tr>`).join('')}</table>
    <h3 style="margin:14px 0 4px">Results</h3><table class="mr">${d.matches.map(m => `<tr><td class="dim">${esc(m.label)}</td>
      <td class="${m.w === 'a' ? 'won' : ''}">${esc(m.a)}</td><td>${m.ga}–${m.gb}</td><td class="${m.w === 'b' ? 'won' : ''}">${esc(m.b)}</td></tr>`).join('')}</table>`;
}
$('pastList').addEventListener('click', async e => {
  const k = e.target.closest('[data-past]')?.dataset.past;
  if (!k) return;
  pastOpen = pastOpen === k ? null : k;
  drawPast();
  if (pastOpen && !pastData[k]) { pastData[k] = await rpc('cof_archive_get', { p_key: k }).catch(() => null); drawPast(); }
});
drawPast(); setInterval(drawPast, 60000);

// Get the app: pick your phone, then your browser, and see the steps for exactly that.
const LINK = location.origin + location.pathname;
const ADD = (menu, item) => [menu, `Tap <b>${item}</b>.`, 'Tap <b>Add</b> or <b>Install</b> to confirm.', 'Open <b>City of Fighters</b> from your home screen.'];
const SAFARI = ['Tap <b>Copy link</b> below.', 'Open <b>Safari</b> and paste the link in the address bar.', 'Tap <b>Get the app</b> there and choose <b>Safari</b>.'];
const APP_HELP = {
  android: { name: '🤖 Android', browsers: {
    apk: { name: '⬇ Download the app (easiest)', steps: ['Tap <b>Download the app</b> below. If your phone warns about the file, tap <b>Download anyway</b>.', 'Open the file from your notifications or your <b>Downloads</b>.', 'If your phone asks, tap <b>Settings</b>, turn on <b>Allow from this source</b>, and go back.', 'Tap <b>Install</b>. If Play Protect warns about an unknown app, tap <b>More details</b>, then <b>Install anyway</b>.', 'Open <b>City of Fighters</b> from your home screen.'] },
    chrome: { name: 'Chrome', steps: ADD('Tap the three dots <b>⋮</b> at the top right.', 'Add to Home screen</b> or <b>Install app') },
    samsung: { name: 'Samsung Internet', steps: ADD('Tap the menu <b>☰</b> at the bottom right.', 'Add page to</b>, then <b>Home screen') },
    firefox: { name: 'Firefox', steps: ADD('Tap the three dots <b>⋮</b>.', 'Add to Home screen') },
    other: { name: 'Something else', steps: ['Tap <b>Copy link</b> below.', 'Open <b>Chrome</b> and paste the link in the address bar.', 'Tap <b>Get the app</b> there and choose <b>Chrome</b>.'] } } },
  ios: { name: '🍎 iPhone or iPad', browsers: {
    safari: { name: 'Safari', steps: ['Tap the <b>Share</b> button (the square with an arrow pointing up). Can’t see it? Tap <b>•••</b> first.', 'Scroll down and tap <b>Add to Home Screen</b>.', 'Tap <b>Add</b>.', 'Open <b>City of Fighters</b> from your home screen.'] },
    chrome: { name: 'Chrome', steps: ['Tap the <b>Share</b> button in the address bar.', 'Tap <b>Add to Home Screen</b>. Can’t see it? Use Safari instead.', 'Tap <b>Add</b>.', 'Open <b>City of Fighters</b> from your home screen.'] },
    other: { name: 'Something else', steps: SAFARI } } },
};
let installEvent = null, appOs = null, appBrowser = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const dismissed = () => { try { return localStorage.getItem('cofInstallNo') === '1'; } catch { return false; } };
const choice = (k, label) => `<button type="button" data-app="${k}">${label}</button>`;
function drawGetApp() {
  const os = APP_HELP[appOs], b = os?.browsers[appBrowser];
  $('getApp').innerHTML = b ? `<p style="margin:0"><b>${os.name} · ${b.name}</b></p><ol>${b.steps.map(x => `<li>${x}</li>`).join('')}</ol>
      <div class="row">${appOs === 'android' && appBrowser === 'chrome' && installEvent ? '<button type="button" class="primary" data-app="prompt">Install now</button>' : ''}
      ${appBrowser === 'apk' ? '<a class="btnlink" href="downloads/City-of-Fighters.apk" download style="background:linear-gradient(var(--pink),var(--pink2));border:0;color:#fff">Download the app</a>' : ''}
      ${b.steps.join().includes('Copy link') ? '<button type="button" class="primary" data-app="copy">Copy link</button>' : ''}${choice('back', 'Back')}${choice('close', 'Done')}</div>`
    : os ? `<p style="margin:0">${appOs === 'android' ? 'Download the app, or tell us which browser you’re using to install it from there.' : 'Which browser are you using right now?'}</p><div class="choices">${Object.entries(os.browsers).map(([k, v]) => choice('b:' + k, v.name)).join('')}</div>
      <div class="row" style="margin-top:10px">${choice('back', 'Back')}</div>`
    : `<p style="margin:0">Which phone do you have?</p><div class="choices">${Object.entries(APP_HELP).map(([k, v]) => choice('os:' + k, v.name)).join('')}</div>
      <div class="row" style="margin-top:10px">${choice('close', 'Not now')}</div>`;
}
function openGetApp() { appOs = appBrowser = null; drawGetApp(); $('installCard').hidden = false; $('installCard').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
$('getApp').addEventListener('click', async e => {
  const k = e.target.closest('[data-app]')?.dataset.app;
  if (!k) return;
  if (k.startsWith('os:')) appOs = k.slice(3);
  else if (k.startsWith('b:')) appBrowser = k.slice(2);
  else if (k === 'back') { if (appBrowser) appBrowser = null; else appOs = null; }
  else if (k === 'copy') { await navigator.clipboard?.writeText(LINK).catch(() => {}); e.target.textContent = '✓ Copied'; return; }
  else if (k === 'prompt') { installEvent?.prompt(); await installEvent?.userChoice; $('installCard').hidden = true; return; }
  else if (k === 'close') { $('installCard').hidden = true; try { if (canSave()) localStorage.setItem('cofInstallNo', '1'); } catch {} return; }
  drawGetApp();
});
$('getAppLink').onclick = e => { e.preventDefault(); openGetApp(); };
if (standalone) $('getAppLink').hidden = true;
else if (!dismissed()) { drawGetApp(); $('installCard').hidden = false; }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; drawGetApp(); });
addEventListener('appinstalled', () => ($('installCard').hidden = true));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
