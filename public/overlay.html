<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City of Fighters Stream</title>
<link rel="stylesheet" href="bracket.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style>
  /* The one OBS Browser Source (1920x1080, transparent). The Stream tab of the website picks what it shows:
     scoreboard, bracket, standings or podium. ?screen=… forces one screen, ?preview=1 adds a stand-in game background. */
  :root { --hud-font: 'Rajdhani', 'Arial Narrow', sans-serif; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; font-family: var(--hud-font); font-weight: 700; color: #fff; overflow: hidden; }
  body.preview { background: radial-gradient(circle at 30% 60%, #3a1d5c, #120a1f 55%), #120a1f; }
  body.preview::before { content: 'GAME FOOTAGE'; position: fixed; inset: 0; display: grid; place-items: center; color: #ffffff12; font: 900 140px system-ui; letter-spacing: 10px; }
  .screen { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .screen.on { opacity: 1; }

  /* HUD across the top (hud/hud-bar.webm, made from the CoF HuD animation in the asets pack).
     Scores sit in the blue boxes, player and team in the black panels, the round name in the pink strip. */
  #hud { position: absolute; top: 0; left: 0; width: 1920px; height: 48px; transition: opacity .4s; filter: drop-shadow(0 3px 8px #000c); }
  #hud video, #hud .poster { position: absolute; inset: 0; width: 1920px; height: 48px; }
  .hscore { position: absolute; top: 0; width: 94px; height: 42px; display: grid; place-items: center; transform: skewX(-12deg);
            font: 800 34px 'Rajdhani', 'Arial Black', sans-serif; color: #fff; text-shadow: 0 0 10px #0ff8, 0 2px 4px #000; font-variant-numeric: tabular-nums; }
  .hscore span { transform: skewX(12deg); }
  #ag { left: 207px; } #bg { left: 1620px; }
  .hinfo { position: absolute; top: 0; height: 42px; width: 395px; display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden;
           font: 700 25px 'Rajdhani', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
  .hinfo .team { font-size: 17px; letter-spacing: 2px; color: #3cc9d4; flex: none; }
  .hinfo .pn { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hinfo .ph { width: 34px; height: 34px; object-fit: cover; flex: none; border: 2px solid #3cc9d4; }
  #ai { left: 312px; } #bi { left: 1215px; justify-content: flex-end; }
  #hlabel { position: absolute; top: 0; left: 738px; width: 442px; height: 21px; display: grid; place-items: center;
            font: 700 13px 'Rajdhani', sans-serif; letter-spacing: 4px; text-transform: uppercase; color: #fff; text-shadow: 0 1px 2px #6a0030; }
  /* player cameras under the names (?cams=1): OBS puts the cameras behind these see-through outlined boxes */
  .hcam { position: absolute; top: 50px; width: 240px; height: 135px; box-sizing: border-box; border: 3px solid #ff0a6c; box-shadow: 0 0 12px #ff0a6caa; }
  .hcam::before, .hcam::after { content: ''; position: absolute; width: 26px; height: 26px; border: 0 solid #3cc9d4; }
  .hcam::before { left: -3px; bottom: -3px; border-width: 0 0 4px 4px; } .hcam::after { right: -3px; top: -3px; border-width: 4px 4px 0 0; }
  #ac { left: 312px; } #bc { left: 1370px; }
  #hud.enter .hcam { animation: fadeUp .4s .5s both; }
  /* a match comes on stream: the HUD drops in, names slide in, scores pop */
  #hud.enter { animation: hudIn .6s cubic-bezier(.2, 1.1, .3, 1) both; }
  #hud.enter #ai { animation: fromL .6s .25s both cubic-bezier(.2, 1.1, .3, 1); }
  #hud.enter #bi { animation: fromR .6s .25s both cubic-bezier(.2, 1.1, .3, 1); }
  #hud.enter .hscore span { animation: pop .45s .5s both cubic-bezier(.2, 1.6, .4, 1); }
  #hud.enter #hlabel { animation: fadeUp .4s .6s both; }
  /* a game is won: the number bursts */
  .hscore.bump span { animation: bump .7s cubic-bezier(.2, 1.6, .4, 1); }
  .hscore.bump::after { content: ''; position: absolute; inset: 0; border: 3px solid #fff; animation: ring .7s ease-out forwards; }
  @keyframes hudIn { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Bottom corners: Gaming Malta + City of Fighters (left), sponsors fading one at a time (right). Logos only, no panel behind them;
     a soft shadow keeps them readable over bright game footage. */
  .plate { position: absolute; bottom: 22px; height: 92px; display: flex; align-items: center; }
  .plate img { filter: drop-shadow(0 2px 6px #000d) drop-shadow(0 0 2px #000a); }
  #brand { left: 28px; gap: 22px; }
  #brand .gm { height: 58px; } #brand .cof { height: 84px; margin-top: -6px; }
  #brand .sep { width: 2px; height: 56px; background: linear-gradient(#ff0a6c00, #ff0a6c, #ff0a6c00); }
  #sponsors { right: 28px; width: 300px; }
  #sponsors img { position: absolute; right: 0; top: 50%; transform: translateY(-50%); max-width: 300px; height: 44px; width: auto; opacity: 0; transition: opacity .8s; }
  #sponsors img.tall { height: 72px; }
  #sponsors img.on { opacity: 1; }

  @keyframes fromL { from { transform: translateX(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fromR { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  @keyframes logoIn { from { transform: translateY(-80px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.45); background: #fff; color: #ff0a6c; } 100% { transform: none; } }
  @keyframes ring { from { transform: scale(1); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }

  /* the match on stream ended: winner for 6 s, then "waiting" until a new match is put on stream */
  .full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          opacity: 0; transition: opacity .5s; pointer-events: none; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #26262af2, #0e0e10fa 70%); }
  .full.on { opacity: 1; }
  .full > * { position: relative; }
  /* winner: logo drops in, name slams in, light rays turn behind it */
  #winCard .rays { position: absolute; width: 1800px; height: 1800px; left: 50%; top: 50%; margin: -900px 0 0 -900px;
                   background: repeating-conic-gradient(#ffd24a1c 0 6deg, transparent 6deg 18deg); animation: spin 40s linear infinite;
                   -webkit-mask: radial-gradient(circle, #000 15%, transparent 55%); mask: radial-gradient(circle, #000 15%, transparent 55%); }
  #winCard img { width: 400px; filter: drop-shadow(0 0 24px #ff0a6caa); animation: logoIn .8s both cubic-bezier(.2, 1.4, .4, 1); }
  #winCard img.wph { width: 220px; height: 220px; object-fit: cover; margin-top: 14px; border: 5px solid #ffd24a; box-shadow: 0 0 30px #ffd24a88; filter: none; animation: pop .6s .6s both cubic-bezier(.2, 1.4, .4, 1); }
  #winCard .wl { font-size: 30px; letter-spacing: 12px; color: #3cc9d4; margin-top: 16px; animation: fadeUp .6s .5s both; }
  #winCard .wn { font-size: 150px; line-height: 1.05; font-style: italic; text-transform: uppercase; color: #ffd24a; overflow: hidden; padding: 0 40px;
                 text-shadow: 0 0 40px #ffd24aaa; animation: slam .6s .8s both cubic-bezier(.2, 1.3, .4, 1), glowGold 1.6s 1.6s infinite alternate; }
  #winCard .wn::after { content: ''; position: absolute; top: 0; bottom: 0; width: 160px; left: -200px; background: linear-gradient(90deg, transparent, #fff8, transparent); transform: skewX(-20deg); animation: sweep 1.4s 1.5s ease-in-out 2; }
  #winCard .ws { font: 700 40px system-ui, sans-serif; color: #f2f2f5; animation: fadeUp .6s 1.3s both; }
  #winCard .ws b { color: #ffd24a; font-size: 52px; }
  /* Coming Up (between matches): the Cof_Coming_Up_Screen_P1 artwork. In the OBS "CoF Coming Up" scene its windows are
     see-through and OBS shows the shared screen and player cameras in them; anything missing gets a filler here instead. */
  .cu { position: absolute; inset: 0; }
  .cu .bg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .cu .title { position: absolute; left: 400px; top: 150px; height: 52px; display: flex; align-items: center; gap: 14px; max-width: 860px;
               font: 700 34px var(--hud-font); text-transform: uppercase; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 8px #000, 0 0 2px #000; white-space: nowrap; }
  .cu .title i { font-style: normal; color: #3cc9d4; font-size: 26px; }
  .cu .title small { font-size: 20px; color: #ff4f95; letter-spacing: 3px; }
  .cu .win { position: absolute; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
             background: radial-gradient(ellipse at 50% 40%, #2b1020, #08080a 70%); }
  .cu .win.big .logo { width: 360px; filter: drop-shadow(0 0 18px #ff0a6c77); }
  .cu .win.cam .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cu .win.cam .nm { position: relative; font: 700 46px var(--hud-font); text-transform: uppercase; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 8px #000; }
  .cu .win.cam .tm { position: relative; font: 700 22px var(--hud-font); letter-spacing: 4px; color: #3cc9d4; text-transform: uppercase; }
  .cu .tag { position: absolute; left: 1324px; width: 532px; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
             background: linear-gradient(90deg, #ff0a6c, #b0074b); clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
             font: 700 28px var(--hud-font); text-transform: uppercase; letter-spacing: 2px; color: #fff; white-space: nowrap; overflow: hidden; }
  .cu .tag img { width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; }
  .cu .tag .tm { font-size: 17px; letter-spacing: 3px; color: #ffe0ec; }
  .cu .tag.t1 { top: 510px; } .cu .tag.t2 { top: 882px; }
  #cuCard.on .tag, #cuCard.on .title { animation: fadeUp .6s .3s both; }
  #s-scoreboard:has(#cuCard.on) .plate { opacity: 0; } /* the Coming Up artwork has its own branding */
  .plate { transition: opacity .5s; }
  @keyframes slam { from { transform: scale(3); opacity: 0; filter: blur(8px); } to { transform: none; opacity: 1; filter: none; } }
  @keyframes glowGold { to { text-shadow: 0 0 70px #ffd24a, 0 0 10px #fff; } }
  @keyframes float { 50% { transform: translateY(-16px); } }
  @keyframes sweep { to { left: 110%; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { text-shadow: 0 0 34px #ff1a1a, 0 0 6px #fff; } }
  @keyframes blink { 0%, 100% { opacity: .2; transform: scale(.7); } 40% { opacity: 1; transform: none; } }

  /* Bracket and standings panels */
  .panel { position: absolute; top: 20px; left: 50%; transform-origin: top center; background: #0e0e10e8; border-top: 6px solid #ff0a6c; padding: 18px 26px; border-radius: 0 0 10px 10px; }
  .ptop { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; color: #3cc9d4; letter-spacing: 2px; font: 700 20px system-ui, sans-serif; }
  .ptop img { width: 70px; border-radius: 6px; }
  #stand { width: 1000px; font-size: 26px; }
  #stand table { width: 100%; border-collapse: collapse; }
  #stand td { padding: 8px 6px; border-bottom: 1px solid #2e2e35; }
  #stand td.n { text-align: right; color: #c9c9d1; font: 700 24px system-ui, sans-serif; }
  #stand tr:first-child td:first-child { color: #ff0a6c; }

  /* Podium */
  #podium { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; background: radial-gradient(ellipse at 50% 100%, #ff0a6c33, #0e0e10f0 65%); }
  #podium .logo { width: 210px; margin-top: 40px; border-radius: 12px; box-shadow: 0 0 40px #ff0a6c77; animation: drop .8s both cubic-bezier(.2, 1.3, .4, 1); }
  #podium h1 { margin: 18px 0 0; font-size: 46px; letter-spacing: 6px; color: #3cc9d4; text-shadow: 0 0 20px #3cc9d499; animation: fade .8s .3s both; }
  .stands { display: flex; align-items: flex-end; gap: 26px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
  .stand { width: 380px; display: flex; flex-direction: column; align-items: center; }
  .stand .who { text-align: center; margin-bottom: 18px; animation: drop .7s both cubic-bezier(.2, 1.3, .4, 1); }
  .stand .pname { font-size: 46px; font-style: italic; text-transform: uppercase; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stand .rec { font: 600 22px system-ui, sans-serif; color: #c9c9d1; }
  .stand .block { width: 100%; display: grid; place-items: start center; padding-top: 20px; font-size: 90px; border-radius: 10px 10px 0 0;
                  background: linear-gradient(#2a1240, #120a1f); border-top: 8px solid var(--c); color: var(--c); text-shadow: 0 0 24px var(--c);
                  transform-origin: bottom; animation: rise .9s both cubic-bezier(.2, 1.1, .4, 1); }
  .stand.p1 { --c: #ffd24a; } .stand.p2 { --c: #d9d2e6; } .stand.p3 { --c: #e08a5a; }
  .stand.p1 .block { height: 380px; animation-delay: 1.6s; } .stand.p1 .who { animation-delay: 2.4s; }
  .stand.p2 .block { height: 270px; animation-delay: 1s; }   .stand.p2 .who { animation-delay: 1.8s; }
  .stand.p3 .block { height: 190px; animation-delay: .4s; }  .stand.p3 .who { animation-delay: 1.2s; }
  .stand.p1 .pname { color: #ffd24a; text-shadow: 0 0 24px #ffd24aaa; animation: glow 1.6s 3.2s infinite alternate; font-size: 58px; }
  .stand .pph { display: block; width: 150px; height: 150px; object-fit: cover; margin: 0 auto 10px; border: 4px solid var(--c); box-shadow: 0 0 24px var(--c); }
  .crown { font-size: 54px; animation: drop .7s 2.8s both cubic-bezier(.2, 1.3, .4, 1); }
  .confetti i { position: absolute; top: -30px; width: 12px; height: 20px; animation: fall linear infinite; opacity: .9; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: none; } }
  @keyframes drop { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes glow { to { text-shadow: 0 0 40px #ffd24a, 0 0 8px #fff; } }
  @keyframes fall { to { transform: translateY(1140px) rotate(720deg); } }

  /* Result popup for matches played off stream: fades in, stays 5 s, fades out. Styled like the HUD panels. */
  #pop { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); opacity: 0; transition: opacity .6s ease;
         max-width: 1200px; white-space: nowrap; text-align: center; padding: 8px 40px 10px;
         background: linear-gradient(#26262a, #0e0e10); border-top: 3px solid #ff0a6c; box-shadow: 0 6px 18px #000b;
         clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 100%, 0 100%); font-family: var(--hud-font); }
  #pop.show { opacity: 1; }
  #pop .tag { font: 700 13px var(--hud-font); letter-spacing: 4px; color: #3cc9d4; }
  #pop .main { font: 700 26px var(--hud-font); text-transform: uppercase; letter-spacing: 1px; margin: 1px 0; }
  #pop .main b { color: #ff0a6c; }
  #pop .sub { font: 600 17px var(--hud-font); letter-spacing: 1px; color: #c9c9d1; }
  #pop .sub.out { color: #ff5a8f; }
</style>
</head>
<body>
<div class="screen" id="s-scoreboard">
  <div id="hud" style="opacity:0">
    <img class="poster" src="hud/hud-bar.png" alt="">
    <video src="hud/hud-bar.webm" autoplay loop muted playsinline></video>
    <div class="hscore" id="ag"><span>0</span></div>
    <div class="hinfo" id="ai"><img class="ph" alt="" hidden><span class="team"></span><span class="pn"></span></div>
    <div id="hlabel"></div>
    <div class="hinfo" id="bi"><span class="pn"></span><span class="team"></span><img class="ph" alt="" hidden></div>
    <div class="hscore" id="bg"><span>0</span></div>
    <div class="hcam" id="ac" hidden></div><div class="hcam" id="bc" hidden></div>
  </div>
  <div class="full" id="winCard"></div>
  <div class="full" id="cuCard"><div class="cu" id="cuWait"></div></div>
  <div class="plate" id="brand"><img class="gm" src="hud/gaming-malta-logo.png" alt="Gaming Malta"><span class="sep"></span><img class="cof" src="hud/cof-logo.png" alt="City of Fighters"></div>
  <div class="plate" id="sponsors"></div>
</div>
<div class="screen" id="s-bracket"><div class="panel" id="bracketBox"><div class="ptop"><img src="hud/cof-logo.png" alt=""><span id="bsub"></span></div><div id="b"></div></div></div>
<div class="screen" id="s-standings"><div class="panel" id="standBox"><div class="ptop"><img src="hud/cof-logo.png" alt=""><span id="ssub"></span></div><div id="stand"></div></div></div>
<div class="screen" id="s-podium"><div id="podium"></div></div>
<div class="screen" id="s-comingup"><div class="cu" id="cuLive"></div></div>
<div id="pop" aria-live="polite"></div>
<script src="bracket.js"></script><script src="api.js"></script><script src="bracketview.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
if (params.get('preview')) document.body.classList.add('preview');
if (params.has('cams')) document.querySelectorAll('.hcam').forEach(el => el.hidden = false);
const ord = n => n + ((n % 100 > 10 && n % 100 < 14) ? 'th' : { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
const record = (s, r) => s.format === 'robin' || s.format === 'swiss' ? `${r.pts} pts · games ${r.gw}–${r.gl}` : `${r.w}–${r.l} · games ${r.gw}–${r.gl}`;
const fit = (box, maxScale) => { // grow small / shrink big panels to fill the screen
  box.style.transform = 'translateX(-50%)';
  box.style.transform = `translateX(-50%) scale(${Math.min(maxScale, 1880 / box.offsetWidth, 1040 / box.offsetHeight)})`;
};

// --- Result popups for matches finished off stream ---
let seen = null, lastStream = null;
const popups = [];
function resultText(s, m) {
  const name = id => (id === m.a ? m.aName : m.bName).toUpperCase();
  const tag = `<div class="tag">${esc(m.label.toUpperCase())} · RESULT</div>`;
  if (m.side === 'R') {
    const r = s.standings.find(x => x.id === m.winner);
    return `${tag}<div class="main"><b>${esc(name(m.winner))}</b> has won against ${esc(name(m.loser))}</div><div class="sub">${esc(name(m.winner))} now has ${r?.pts ?? 0} points</div>`;
  }
  const champ = !m.winTo && !m.loseTo && (m.id !== 'GF1' || m.winner === m.a);
  const next = m.winTo && s.matches.find(x => x.id === m.winTo.id);
  const main = champ ? `<b>${esc(name(m.winner))}</b> is the CHAMPION!`
    : `<b>${esc(name(m.winner))}</b> has won and is moving on to the ${esc(next?.label ?? 'Grand Final Reset')}`;
  const sub = m.id === 'GF1' && !champ ? `<div class="sub">${esc(name(m.loser))} gets one more chance in the reset</div>`
    : m.loseTo ? `<div class="sub">${esc(name(m.loser))} drops to the losers bracket</div>`
    : `<div class="sub out">${esc(name(m.loser))} is eliminated</div>`;
  return `${tag}<div class="main">${main}</div>${sub}`;
}
async function showPopups() {
  while (popups.length) {
    $('pop').innerHTML = popups.shift();
    $('pop').classList.add('show');                       // fade in (0.6 s)
    await new Promise(r => setTimeout(r, 600 + 5000));    // fully visible for 5 s
    $('pop').classList.remove('show');                    // fade out (0.6 s)
    await new Promise(r => setTimeout(r, 600 + 400));     // gone completely before the next one
  }
}

// --- Podium ---
function podiumHTML(s) {
  const at = p => s.standings.filter(r => r.place === p);
  const stand = (p, rows) => !rows.length ? '<div class="stand"></div>' : `<div class="stand p${p}"><div class="who">
      ${p === 1 ? '<div class="crown">👑</div>' : ''}${rows.length === 1 ? photoImg(s.players.find(x => x.id === rows[0].id), 'pph') : ''}<div class="pname">${rows.map(r => esc(r.name)).join(' & ')}</div>
      <div class="rec">${esc(record(s, rows[0]))}</div></div><div class="block">${ord(p)}</div></div>`;
  const colors = ['#ff0a6c', '#3cc9d4', '#ffd24a', '#ffffff', '#1f8f99'];
  const confetti = Array.from({ length: 70 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${colors[i % 5]};animation-duration:${3 + Math.random() * 4}s;animation-delay:${2.6 + Math.random() * 4}s"></i>`).join('');
  return `<img class="logo" src="hud/cof-logo.png" alt=""><h1>${esc(s.game.toUpperCase())} · FINAL RESULTS</h1>
    <div class="stands">${stand(2, at(2))}${stand(1, at(1))}${stand(3, at(3))}</div><div class="confetti">${confetti}</div>`;
}

// --- Sponsors: one at a time; each fades in, stays 4 s, fades out, then the next fades in ---
const SPONSORS = [['rupture', 'Rupture'], ['gamebreaker', 'Gamebreaker'], ['immerse', 'Immerse VR Gaming Arena'],
  ['level-academy', 'Level Academy', 'tall'], ['malta-esports-association', 'Malta Esports Association', 'tall'], ['new-madras', 'New Madras', 'tall']];
const sponsorBox = document.getElementById('sponsors');
sponsorBox.innerHTML = SPONSORS.map(([f, n, c]) => `<img src="hud/sponsors/${f}.png" alt="${n}"${c ? ` class="${c}"` : ''}>`).join('');
function nextSponsor(i) {
  const img = sponsorBox.children[i % SPONSORS.length];
  img.classList.add('on');
  setTimeout(() => img.classList.remove('on'), 800 + 4000); // fade in, then 4 s fully visible
  setTimeout(() => nextSponsor(i + 1), 800 + 4000 + 800); // next one starts once this one has faded out
}
setTimeout(() => nextSponsor(0), 100); // after the first paint, so the first logo fades in too

// --- Scoreboard: live match, then winner for 6 s, then "waiting" until a new match goes on stream ---
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
let sbMatch = null, sbLive = false, winUntil = 0, prevGames = {}, sbPhase = 'none';

// --- Coming Up screen (between matches) ---
// holes = true in OBS's "CoF Coming Up" scene: the windows stay see-through for the live screen and cameras that OBS
// places there (listed in ?has=), and only windows without a source get a filler.
const has = new Set((params.get('has') || '').split(',').filter(Boolean));
function nextMatch(s) {
  const cur = s.matches.find(x => x.id === s.streamMatch);
  if (cur && !cur.winner) return cur;
  return s.matches.find(x => x.ready && x.id !== s.streamMatch) ?? null;
}
let cuKey = '';
function comingUp(el, s, holes) {
  const m = nextMatch(s), P = [m?.aPlayer, m?.bPlayer];
  const key = JSON.stringify([holes, m?.id, P.map(p => [p?.name, p?.team, p && photoOf(p)?.length]), s.finished]);
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  const name = p => esc((p?.name ?? 'TBD').toUpperCase());
  const team = p => p?.team ? `<span class="tm">${esc(p.team)}</span>` : '';
  const camFill = (p, slot) => holes && has.has(slot) ? '' : `<div class="win cam" style="${rect(slot)}">${photoOf(p) ? `<img class="pic" src="${photoOf(p)}" alt="">` : `${team(p)}<div class="nm">${name(p)}</div>`}</div>`;
  const tag = (p, cls) => p ? `<div class="tag ${cls}">${photoImg(p, '')}${team(p)}<span>${name(p)}</span></div>` : '';
  el.innerHTML = `<img class="bg" src="hud/${holes ? 'coming-up-frame' : 'coming-up'}.png" alt="">`
    + (m ? `<div class="title">${name(P[0])} <i>VS</i> ${name(P[1])} <small>· ${esc(m.label.toUpperCase())}</small></div>` : `<div class="title">${s.finished ? 'THANKS FOR WATCHING' : 'NEXT MATCH SOON'}</div>`)
    + (holes && has.has('screen') ? '' : `<div class="win big" style="${rect('screen')}"><img class="logo" src="hud/cof-logo.png" alt=""></div>`) // the game goes here; just the logo until there is one
    + (m ? camFill(P[0], 'cam1') + camFill(P[1], 'cam2') + tag(P[0], 't1') + tag(P[1], 't2') : '');
}
const CU = { screen: [64, 206, 1192, 668], cam1: [1324, 207, 532, 294], cam2: [1324, 579, 532, 294] }; // windows of the artwork
const rect = k => { const [x, y, w, h] = CU[k]; return `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; };

// Between matches OBS shows the "CoF Coming Up" scene and switches back when a match starts. This only works when the
// Stream tab has set the scene up (which gives this page OBS's "Advanced" access); otherwise nothing happens here.
let obsTarget = null;
function obsSwitch(target) {
  if (!target || target === obsTarget) return;
  obsTarget = target;
  window.obsstudio?.getControlLevel?.(level => { if (level >= 4) window.obsstudio.setCurrentScene(target); });
}
function scoreboard(s, m) {
  const live = !!m && !m.winner;
  if (m?.winner && sbMatch === m.id && sbLive) { // the viewers just watched it end
    const w = m.winner === m.a ? 'a' : 'b';
    $('winCard').innerHTML = `<div class="rays"></div><img src="logo-clear.png" alt="">${photoImg(w === 'a' ? m.aPlayer : m.bPlayer, 'wph')}<div class="wl">${esc(m.label.toUpperCase())} · WINNER</div>
      <div class="wn">${esc(w === 'a' ? m.aName : m.bName)}</div>
      <div class="ws">wins <b>${Math.max(m.ga, m.gb)}–${Math.min(m.ga, m.gb)}</b> against ${esc(w === 'a' ? m.bName : m.aName)}</div>`;
    winUntil = Date.now() + 6000; // the next draw after this switches to "waiting"
  }
  const phase = live ? 'live' : m?.winner ? (Date.now() < winUntil ? 'winner' : 'waiting') : 'none';
  if (live && (sbMatch !== m.id || !sbLive)) { restart($('hud'), 'enter'); prevGames = { a: m.ga, b: m.gb }; }
  if (live) {
    $('hlabel').textContent = m.label;
    for (const k of ['a', 'b']) {
      const info = $(k + 'i');
      info.querySelector('.pn').textContent = m[k + 'Name'] ?? 'TBD';
      info.querySelector('.team').textContent = m[k + 'Team'] ?? ''; // players without a team show just their name
      const ph = info.querySelector('.ph'), src = photoOf(m[k + 'Player']);
      ph.hidden = !src; if (src && ph.src !== src) ph.src = src; // no photo: no image and no empty space
      if (m['g' + k] > (prevGames[k] ?? 0)) restart($(k + 'g'), 'bump');
      $(k + 'g').firstChild.textContent = m['g' + k];
    }
    prevGames = { a: m.ga, b: m.gb };
  }
  $('hud').style.opacity = live ? 1 : 0;
  $('winCard').classList.toggle('on', phase === 'winner');
  $('cuCard').classList.toggle('on', phase === 'waiting');
  if (phase === 'waiting') comingUp($('cuWait'), s, false);
  sbPhase = phase;
  sbMatch = m?.id ?? null; sbLive = live;
}

let shown = null, lastBracket = null, bracketKey = '', podiumKey = '';
async function draw() {
  const s = view(await rpc('cof_public'));
  const screen = params.get('screen') || s.screen;

  // popups (not over the podium)
  const done = s.matches.filter(x => x.winner && !x.auto);
  if (seen && screen !== 'podium') {
    const fresh = done.filter(x => !seen.has(x.id) && x.id !== lastStream);
    const idle = !popups.length && !$('pop').classList.contains('show');
    popups.push(...fresh.map(x => resultText(s, x)));
    if (idle && popups.length) showPopups();
  }
  seen = new Set(done.map(x => x.id));
  lastStream = s.streamMatch;

  if (screen !== shown) {
    document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === 's-' + screen));
    if (screen === 'podium') podiumKey = ''; // replay the podium animation each time it is shown
    shown = screen;
  }

  scoreboard(s, s.matches.find(x => x.id === (params.has('match') ? params.get('match') : s.streamMatch))); // ?match= previews another match
  if (screen === 'comingup') {
    comingUp($('cuLive'), s, true);
    const cur = s.matches.find(x => x.id === s.streamMatch);
    if (params.get('main') && !(s.screen === 'scoreboard' && cur?.winner && !s.finished)) obsSwitch(params.get('main'));
    else if (s.screen === 'scoreboard' && cur?.winner && !s.finished) obsTarget = null; // ready to switch back next time
  } else if (!params.get('screen')) {
    if (screen === 'scoreboard' && sbPhase === 'waiting' && !s.finished) obsSwitch('CoF Coming Up');
    else obsTarget = null;
  }

  // bracket: redraw only on changes, so each animation plays once
  const key = JSON.stringify([s.matches, s.streamMatch, s.game]);
  if (key !== bracketKey) {
    $('bsub').textContent = `${s.game.toUpperCase()} · ${s.format === 'robin' || s.format === 'swiss' ? 'MATCHES' : 'BRACKET'}`;
    $('b').innerHTML = s.matches.length ? bracketHTML(s, bracketKey ? lastBracket : null) : '<span style="color:#9d9daa;font-family:system-ui">Not started yet.</span>';
    lastBracket = s.matches; bracketKey = key;
  }
  if (screen === 'bracket') fit($('bracketBox'), 2);

  // standings (shortcut: top 12 only; add paging if the field gets bigger)
  $('ssub').textContent = `${s.game.toUpperCase()} · STANDINGS`;
  $('stand').innerHTML = '<table>' + s.standings.slice(0, 12).map(r => `<tr><td style="width:90px">${r.place ? ord(r.place) : '—'}</td>
    <td>${esc(r.name)}</td><td class="n">${esc(record(s, r))}</td></tr>`).join('') + '</table>';
  if (screen === 'standings') fit($('standBox'), 1.4);

  // podium
  const pkey = JSON.stringify(s.standings.slice(0, 4));
  if (screen === 'podium' && pkey !== podiumKey) { $('podium').innerHTML = s.finished ? podiumHTML(s) : params.get('preview') ? '<h1 style="margin-top:400px;color:#3cc9d4">The podium appears when the tournament ends</h1>' : ''; podiumKey = pkey; }
}
// Designed at 1920×1080; any other Browser Source size scales the whole page to fit.
const fitPage = () => { document.body.style.zoom = Math.min(innerWidth / 1920, innerHeight / 1080); };
addEventListener('resize', fitPage); fitPage();
live(draw);
</script>
</body>
</html>
